<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title {% if page.url == '/' %}active{% endif %}" rel="author" href="{{ '/' | relative_url }}">
      {{ site.title | escape }}
    </a>

    <nav class="site-nav">
      <input type="checkbox" id="nav-trigger" class="nav-trigger" />
      <label for="nav-trigger">
        <span class="menu-icon">
          <svg viewBox="0 0 18 15" width="18px" height="15px">
            <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.032C17.335,0,18,0.665,18,1.484L18,1.484z M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.032C17.335,6.031,18,6.696,18,7.516L18,7.516z M18,13.516C18,14.335,17.335,15,16.516,15H1.484 C0.665,15,0,14.335,0,13.516l0,0c0-0.82,0.665-1.483,1.484-1.483h15.032C17.335,12.031,18,12.695,18,13.516L18,13.516z"/>
          </svg>
        </span>
      </label>

      <div class="trigger">
        <a class="page-link {% if page.url == '/' %}active{% endif %}" href="{{ '/' | relative_url }}">
          <i class="bi bi-house-door" style="color: #CC6600;"></i> <span>Home</span>
        </a>

        <a class="page-link {% if page.url == '/agentic-workflow/' %}active{% endif %}" href="{{ '/agentic-workflow/' | relative_url }}">
          <span>Agentic Workflows</span>
        </a>

        <a class="page-link {% if page.url == '/optimization/' %}active{% endif %}" href="{{ '/optimization/' | relative_url }}">
          <span>Optimization</span>
        </a>
        
        <div class="nav-dropdown">
          <a class="page-link dropdown-toggle {% if page.url == '/ae-spm/' or page.url == '/ae-stem/' or page.url == '/nanoindentation/' %}active{% endif %}" style="cursor: pointer;">
            <span>Autonomous Instruments</span> <i class="bi bi-chevron-down" style="font-size: 0.7rem; margin-left: 3px;"></i>
          </a>
          
          <div class="dropdown-content">
            <a href="{{ '/ae-spm/' | relative_url }}" class="{% if page.url == '/ae-spm/' %}active-sub{% endif %}">AE SPM</a>
            <a href="{{ '/ae-stem/' | relative_url }}" class="{% if page.url == '/ae-stem/' %}active-sub{% endif %}">AE STEM</a>
            <a href="{{ '/nanoindentation/' | relative_url }}" class="{% if page.url == '/nanoindentation/' %}active-sub{% endif %}">AE Nanoindentation</a>
          </div>
        </div>

        <a class="page-link {% if page.url == '/about/' %}active{% endif %}" href="{{ '/about/' | relative_url }}">
          <i class="bi bi-globe" style="color: #CC6600;"></i> <span>About</span>
        </a>
      </div>
    </nav>
  </div>
</header>
